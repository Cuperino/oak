# Staging area for the oak-gpui-fork widget modules (dock, effect_stack,
# node_graph, timeline) being lifted onto gpui-kit. When the lift is
# complete this crate folds into oak-app as `crate::widgets`.

[package]
name = "oak-widgets"
version.workspace = true
edition = "2024"

[dependencies]
gpui-kit = "0.7.3"

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["test-support"] }
